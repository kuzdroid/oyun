# Ormanın Kalbi - iPhone sürümünü Codemagic'in bulut Mac'lerinde derler ve App Store Connect'e (TestFlight) yükler.
# Mac gerekmez. GitHub deposunda yalnızca bu dosya ve proje.zip bulunur; derleme proje.zip'i kendisi açar.
workflows:
  # 1) Apple hesabı gerekmez: oyunun iPhone için hatasız derlendiğini gösterir (imzasız, telefona kurulamaz)
  iphone-deneme:
    name: Ormanın Kalbi iPhone (deneme, imzasız)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Projeyi aç
        script: unzip -q -o proje.zip
      - name: Paketleri kur
        script: npm ci
      - name: iPhone projesini hazırla
        script: |
          rm -rf ios
          npx cap add ios --packagemanager SPM
          cp ayarlar/Info.plist ios/App/App/Info.plist
          rm -rf ios/App/App/Assets.xcassets
          cp -R ayarlar/Assets.xcassets ios/App/App/Assets.xcassets
          npx cap sync ios
      - name: İmzasız derle
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          cd build/ipa && zip -qr OrmaninKalbi-imzasiz.ipa Payload
    artifacts:
      - build/ipa/*.ipa

  # 2) Apple Developer hesabıyla: imzalı .ipa üretir ve TestFlight'a yükler
  iphone-appstore:
    name: Ormanın Kalbi iPhone (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: OrmaninKalbi     # Codemagic'te eklediğin App Store Connect API anahtarının adı
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yesilvadi.ormaninkalbi
      node: 22
      xcode: latest
    scripts:
      - name: Projeyi aç
        script: unzip -q -o proje.zip
      - name: Paketleri kur
        script: npm ci
      - name: iPhone projesini hazırla
        script: |
          if [ ! -d ios/App/App.xcodeproj ]; then
            rm -rf ios
            npx cap add ios --packagemanager SPM
            cp ayarlar/Info.plist ios/App/App/Info.plist
            rm -rf ios/App/App/Assets.xcassets
            cp -R ayarlar/Assets.xcassets ios/App/App/Assets.xcassets
          fi
          npx cap sync ios
      - name: İmza profillerini uygula
        script: xcode-project use-profiles
      - name: .ipa üret
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
