# Ormanın Kalbi (C++) - iPhone sürümünü Codemagic'in bulut Mac'lerinde derler. Mac gerekmez.
# GitHub deposunda yalnızca bu dosya ve proje.zip bulunur. Çıkan imzasız .ipa Sideloadly ile telefona kurulur.
workflows:
  iphone-deneme:
    name: Ormanın Kalbi iPhone (C++, imzasız)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Projeyi aç
        script: unzip -q -o proje.zip
      - name: Kütüphaneleri indir (SDL2, mbedTLS, libdatachannel)
        script: |
          mkdir -p kaynak && cd kaynak
          git clone -q --depth 1 --branch release-2.30.10 https://github.com/libsdl-org/SDL.git
          git clone -q --depth 1 --branch v3.6.2 --recursive --shallow-submodules https://github.com/Mbed-TLS/mbedtls.git
          git clone -q --depth 1 --branch v0.22.6 --recursive --shallow-submodules https://github.com/paullouisageneau/libdatachannel.git
      - name: Xcode projesini oluştur
        script: |
          cmake -S ios -B build -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: İmzasız derle
        script: |
          xcodebuild -project build/OrmaninKalbiIOS.xcodeproj -target OrmaninKalbi -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -40
          APP=$(find build -type d -name "OrmaninKalbi.app" -path "*iphoneos*" | head -1)
          echo "uygulama: $APP"
          mkdir -p cikti/Payload
          cp -R "$APP" cikti/Payload/
          cd cikti && zip -qr OrmaninKalbi-iPhone.ipa Payload
    artifacts:
      - cikti/*.ipa